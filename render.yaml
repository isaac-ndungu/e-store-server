# Render blueprint for the Django API. PostgreSQL comes from Neon (external
# DATABASE_URL); Redis comes from Render Key Value. The frontend points at the
# web service URL (https://<name>.onrender.com).
services:
  - type: web
    name: e-store-api
    runtime: python
    plan: free
    buildCommand: "./scripts/render-build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Neon pooled connection string in the dashboard
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: e-store-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        sync: false # e.g. https://shop.example.com (set once the storefront URL is known)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://shop.example.com (must include the storefront origin)
      - key: RESEND_API_KEY
        sync: false # resend.com/api-keys (starts with re_); empty disables intake email sending
      - key: ORDER_FROM_EMAIL
        sync: false # must be on the verified Resend domain, e.g. orders@vifaar.co.ke
      - key: ORDER_INTAKE_EMAIL
        sync: false # shop mailbox receiving customer orders (mirrors SiteConfig.order_intake_email)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # Cloudinary console > Settings > API Keys; empty keeps local media storage
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false # optional upload prefix, e.g. e-store

  - type: worker
    name: e-store-worker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.4
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false # copy the same value as the web service (shared signing key)
      - key: DATABASE_URL
        sync: false # same Neon pooled connection string as the web service
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: e-store-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false # same value as the web service (worker sends the intake email via Celery)
      - key: ORDER_FROM_EMAIL
        sync: false # same value as the web service
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # same values as the web service so tasks can read uploaded media
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        sync: false

  - type: keyvalue
    name: e-store-redis
    plan: free
    maxmemoryPolicy: noeviction
    # Render rejects an empty list here, so allow only loopback (unroutable over
    # the public internet). The API and worker reach Redis over the private
    # network, which this list does not restrict.
    ipAllowList:
      - source: 127.0.0.1/32
        description: no public access
