# CI pipeline skeleton for the e-commerce platform.
#
# Currently: lint, reference hygiene, Django system checks, migrations check,
# and tests. Later: coverage gates and image builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Forbid plan/step/rule references in code
        run: |
          matches=$(grep -rInE '[Ss]tep[[:space:]]*[0-9]|[Pp]hase[[:space:]]*[0-9]|docs/plan[.]md|per the[ ]plan|AGENTS[.]md' . \
            --exclude-dir=.git --exclude-dir=docs --exclude-dir=env --exclude-dir=.venv \
            --exclude-dir=__pycache__ --exclude-dir=.ruff_cache --exclude='*.pyc' \
            --exclude='*.pyo' --exclude='.gitignore' --exclude='AGENTS[.]md' \
            --exclude='AGENTS.*.md' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Found a reference to the plan document, a numbered step/phase, or the repo guidance file. Re-express it without such a pointer."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-non-prod-key
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Run migrations check (no pending changes)
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
